<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Mike McBride graph favicon</title>
  <desc id="desc">Two connected capital M shapes constructed from graph edges and solid circular nodes.</desc>

  <!-- Exact center-to-center graph edges -->
  <g fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M160 650V150L400 390L640 150V650"/>
    <path d="M270 650V390L400 520L530 390V650"/>
    <path d="M400 390V520"/>
  </g>

  <!-- Uniform solid nodes optimized for small-size recognition -->
  <g fill="currentColor">
    <circle cx="160" cy="150" r="25"/>
    <circle cx="400" cy="390" r="25"/>
    <circle cx="640" cy="150" r="25"/>

    <circle cx="270" cy="390" r="25"/>
    <circle cx="400" cy="520" r="25"/>
    <circle cx="530" cy="390" r="25"/>

    <circle cx="160" cy="650" r="25"/>
    <circle cx="270" cy="650" r="25"/>
    <circle cx="530" cy="650" r="25"/>
    <circle cx="640" cy="650" r="25"/>
  </g>
</svg>
